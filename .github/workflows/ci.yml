name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC: the live contract tests against the real
    # institutions. A source changing its format fails here, not in a user's
    # assistant.
    - cron: '0 6 * * 1'

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

  live-contracts:
    name: live source contracts
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # On a push the live run is a smoke signal, not a gate: a government
    # server timing out for a minute must not paint a release commit red.
    # The weekly scheduled run is the gate — there a failure is real drift.
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live

  guardmcp:
    # The example client config in this repo, scanned by guardmcp: the
    # server we ship is also a server someone will install, so it goes
    # through the same check we ask everyone else to run.
    name: guardmcp scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: BerkantACUN/guardmcp@v0.16.0
        with:
          paths: examples/mcp.json
          fail-on: high
