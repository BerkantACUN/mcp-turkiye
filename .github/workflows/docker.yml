name: Docker

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsup.config.ts
      - src/**
  workflow_dispatch:

jobs:
  image:
    # Pull requests only prove the image builds; tags and manual runs publish it.
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # arm64 is built under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/berkantacun/mcp-turkiye
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Pull requests report the image size next to the base branch's, so a
      # change that bloats the image shows up in the run summary.
      - if: github.event_name == 'pull_request'
        name: image size (amd64, base vs head)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git worktree add /tmp/base FETCH_HEAD
          docker buildx build --load --platform linux/amd64 -t boyut:base /tmp/base
          docker buildx build --load --platform linux/amd64 -t boyut:head .
          base=$(docker image inspect boyut:base --format '{{.Size}}')
          head=$(docker image inspect boyut:head --format '{{.Size}}')
          {
            echo "| image (amd64, uncompressed) | bytes |"
            echo "|---|---|"
            echo "| $BASE_REF | $base |"
            echo "| this PR | $head |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The image must also start: run it as built and wait for /health.
      - if: github.event_name == 'pull_request'
        name: smoke test (container answers /health)
        run: |
          docker run -d --name duman -p 8080:8080 boyut:head
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              echo; docker rm -f duman; exit 0
            fi
            sleep 1
          done
          docker logs duman
          exit 1
